<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GridCards</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       LOGIN SCREEN
  ====================================================== -->

  <section id="authScreen" class="auth-screen">

    <div class="auth-card">

      <div class="auth-logo">
        GC
      </div>

      <h1>Welcome to GridCards</h1>

      <p class="auth-subtitle">
        Enter your details to continue.
      </p>

      <form id="authForm">

        <label for="authName">
          Name
        </label>

        <input
          id="authName"
          type="text"
          placeholder="Enter your name"
          autocomplete="name"
          required
        >


        <label for="authAge">
          Age
        </label>

        <input
          id="authAge"
          type="number"
          min="13"
          max="120"
          placeholder="Age"
          required
        >


        <label>
          Verification
        </label>

        <div class="captcha-row">

          <div
            id="captchaText"
            class="captcha"
            aria-label="Captcha code"
          ></div>

          <button
            id="refreshCaptcha"
            class="captcha-refresh"
            type="button"
            aria-label="Refresh captcha"
          >
            ↻
          </button>

        </div>


        <input
          id="captchaInput"
          type="text"
          placeholder="Enter the code"
          autocomplete="off"
          required
        >

        <p
          id="authError"
          class="form-error"
          aria-live="polite"
        ></p>


        <button
          class="auth-submit"
          type="submit"
        >
          Enter GridCards
        </button>

      </form>

    </div>

  </section>


  <!-- =====================================================
       MAIN APPLICATION
  ====================================================== -->

  <div id="app" class="app hidden">

    <div class="phone">

      <div class="phone-screen">

        <!-- TOP HEADER -->
        <header class="topbar">

          <div class="topbar-main">

            <button
              id="homeBtn"
              class="logo"
              aria-label="GridCards home"
            >
              GC
            </button>


            <div class="search-box">

              <span class="search-icon">
                ⌕
              </span>

              <input
                id="search"
                type="search"
                placeholder="Search posts..."
                aria-label="Search posts"
              >

            </div>


            <button
              id="profileBtn"
              class="profile-button"
              aria-label="Open profile"
            >
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <circle
                  cx="12"
                  cy="8"
                  r="3"
                ></circle>

                <path
                  d="M4 20c0-4 4-6 8-6s8 2 8 6"
                ></path>
              </svg>
            </button>

          </div>


          <!-- CONTROLS -->

          <div class="top-controls">

            <label class="toggle-control">

              <span>
                Contrast
              </span>

              <input
                id="contrastToggle"
                type="checkbox"
              >

              <span class="toggle"></span>

            </label>


            <div class="text-controls">

              <span>
                Text
              </span>

              <button
                id="decText"
                class="control-button"
                type="button"
              >
                A−
              </button>

              <button
                id="incText"
                class="control-button"
                type="button"
              >
                A+
              </button>

            </div>


            <button
              id="openNewPost"
              class="new-post-button"
              type="button"
            >
              ＋ New Post
            </button>

          </div>

        </header>


        <!-- MAIN FEED -->

        <main
          id="main"
          class="feed"
        >

          <div class="feed-heading">

            <div>

              <p class="eyebrow">
                COMMUNITY
              </p>

              <h1>
                Latest posts
              </h1>

            </div>

            <span
              id="postCount"
              class="post-count"
            >
              0 posts
            </span>

          </div>


          <section
            id="grid"
            class="grid"
            aria-label="Post grid"
          ></section>


          <div
            id="emptyState"
            class="empty-state"
            hidden
          >

            <div class="empty-icon">
              🔎
            </div>

            <h2>
              No posts found
            </h2>

            <p>
              Try a different search term.
            </p>

          </div>

        </main>


        <!-- =================================================
             POST DETAIL
        ================================================== -->

        <section
          id="postDetail"
          class="post-detail"
          aria-hidden="true"
        >

          <div class="detail-topbar">

            <button
              id="detailClose"
              class="back-button"
              type="button"
            >
              ← Back
            </button>


            <div class="detail-actions">

              <button
                id="detailAudio"
                class="detail-icon-button"
                type="button"
                aria-label="Play audio"
              >
                🔊
              </button>


              <div class="translate-controls">

                <select
                  id="detailLangSelect"
                  aria-label="Select translation language"
                >
                  <option value="">
                    Language
                  </option>
                </select>

                <button
                  id="detailTranslate"
                  class="translate-button"
                  type="button"
                >
                  Translate
                </button>

              </div>


              <button
                id="detailShare"
                class="detail-icon-button"
                type="button"
                aria-label="Share post"
              >
                🔗
              </button>


              <button
                id="detailDelete"
                class="detail-icon-button delete-button"
                type="button"
                aria-label="Delete post"
                hidden
              >
                🗑
              </button>

            </div>

          </div>


          <div class="detail-scroll">

            <div
              id="detailMedia"
              class="detail-media"
            ></div>


            <div class="detail-content">

              <span
                id="detailShownLang"
                class="detail-language"
              >
                ORIGINAL
              </span>


              <h2
                id="detailTitle"
                class="detail-title"
              ></h2>


              <p
                id="detailDescription"
                class="detail-description"
              ></p>


              <button
                id="detailShowOriginal"
                class="original-button"
                type="button"
              >
                Show original
              </button>


              <div class="comments-section">

                <div class="section-title">
                  <h3>
                    Comments
                  </h3>
                </div>


                <div
                  id="detailCommentsList"
                  class="comments-list"
                ></div>


                <textarea
                  id="detailCommentInput"
                  rows="3"
                  placeholder="Write a comment..."
                ></textarea>


                <button
                  id="detailPostComment"
                  class="primary-button"
                  type="button"
                >
                  Post comment
                </button>

              </div>

            </div>

          </div>

        </section>


        <!-- =================================================
             FLOATING BUTTON
        ================================================== -->

        <button
          id="fabNewPost"
          class="fab"
          type="button"
          aria-label="Create new post"
        >
          ＋
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       CARD TEMPLATE
  ====================================================== -->

  <template id="card-template">

    <article
      class="card"
      tabindex="0"
    >

      <div class="card-media">

        <img
          class="card-image"
          alt=""
        >

      </div>


      <div class="card-content">

        <h2 class="card-title"></h2>

        <p class="card-description"></p>

      </div>


      <div class="card-actions">

        <button
          class="card-action audio"
          type="button"
          aria-label="Play audio"
        >
          🔊
        </button>

        <button
          class="card-action comment"
          type="button"
          aria-label="Comments"
        >
          💬
        </button>

        <button
          class="card-action share"
          type="button"
          aria-label="Share"
        >
          🔗
        </button>

        <button
          class="card-action delete"
          type="button"
          aria-label="Delete"
          hidden
        >
          🗑
        </button>

      </div>

    </article>

  </template>


  <!-- =====================================================
       COMMENTS MODAL
  ====================================================== -->

  <div
    id="commentModal"
    class="modal"
    aria-hidden="true"
  >

    <div class="modal-card">

      <div class="modal-header">

        <h2>
          Comments
        </h2>

        <button
          id="closeModal"
          class="modal-close"
          type="button"
        >
          ×
        </button>

      </div>


      <div
        id="commentsList"
        class="comments-list"
      ></div>


      <textarea
        id="commentInput"
        rows="3"
        placeholder="Write a comment..."
      ></textarea>


      <button
        id="postComment"
        class="primary-button"
        type="button"
      >
        Post comment
      </button>

    </div>

  </div>


  <!-- =====================================================
       NEW POST MODAL
  ====================================================== -->

  <div
    id="newPostModal"
    class="modal"
    aria-hidden="true"
  >

    <div class="modal-card">

      <div class="modal-header">

        <div>

          <p class="eyebrow">
            COMMUNITY
          </p>

          <h2>
            Create post
          </h2>

        </div>

        <button
          id="cancelCreate"
          class="modal-close"
          type="button"
        >
          ×
        </button>

      </div>


      <label for="newTitle">
        Title
      </label>

      <input
        id="newTitle"
        type="text"
        maxlength="100"
        placeholder="Post title"
      >


      <label for="newDesc">
        Description
      </label>

      <textarea
        id="newDesc"
        rows="5"
        placeholder="Write your post..."
      ></textarea>


      <label for="newImgUrl">
        Image URL
      </label>

      <input
        id="newImgUrl"
        type="url"
        placeholder="https://example.com/image.jpg"
      >


      <div class="upload-divider">
        <span>OR</span>
      </div>


      <label
        for="newImgFile"
        class="file-label"
      >
        Upload image
      </label>

      <input
        id="newImgFile"
        type="file"
        accept="image/*"
      >


      <button
        id="createPost"
        class="primary-button modal-submit"
        type="button"
      >
        Publish post
      </button>

    </div>

  </div>


  <!-- =====================================================
       PROFILE MODAL
  ====================================================== -->

  <div
    id="profileModal"
    class="modal"
    aria-hidden="true"
  >

    <div class="modal-card profile-card">

      <button
        id="closeProfile"
        class="modal-close"
        type="button"
      >
        ×
      </button>


      <div
        id="profileAvatar"
        class="profile-avatar"
      >
        G
      </div>


      <h2 id="profileName">
        User
      </h2>


      <p id="profileAge">
      </p>


      <div class="profile-stats">

        <div>

          <strong
            id="profilePostCount"
          >
            0
          </strong>

          <span>
            My posts
          </span>

        </div>


        <div>

          <strong
            id="profileCommentCount"
          >
            0
          </strong>

          <span>
            Comments
          </span>

        </div>

      </div>


      <button
        id="logoutButton"
        class="secondary-button"
        type="button"
      >
        Log out
      </button>

    </div>

  </div>


  <!-- TOAST -->

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>


  <script src="script.js"></script>

</body>
</html>
