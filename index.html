<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GridCards — Blue & White Revamp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<<div id="authWrapper" style="
  position: fixed; inset: 0; 
  display:flex; align-items:center; justify-content:center;
  background:#fff; z-index:9999; padding:20px;">
  <form id="authForm" style="background:#f8faff; padding:20px; border-radius:12px; width:300px; border:1px solid #ddd;">
    <h2 style="margin-top:0;">Login</h2>

    <label>Name</label>
    <input type="text" id="authName" required style="width:100%; padding:8px; margin-bottom:10px;">

    <label>Age</label>
    <input type="number" id="authAge" required style="width:100%; padding:8px; margin-bottom:10px;">

    <label>Captcha</label>
    <div style="display:flex; align-items:center; margin-bottom:10px;">
      <span id="captchaText" style="flex:1; font-weight:bold; font-size:18px;"></span>
      <button id="refreshCaptcha" type="button" style="margin-left:6px;">↻</button>
    </div>

    <input type="text" id="captchaInput" placeholder="Enter captcha" required style="width:100%; padding:8px; margin-bottom:14px;">

    <button type="submit" style="width:100%; padding:10px; background:#007aff; color:white; border:none; border-radius:8px;">Enter</button>
  </form>
</div>
>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="phone" role="application" aria-label="Mobile app mockup">
    <div class="phone-frame" aria-hidden="true"></div>

    <div class="phone-screen" id="phoneScreen">
      <header class="topbar" role="banner" aria-label="Top navigation">
        <div class="topbar-inner">
          <div class="logo" aria-hidden="false" aria-label="GridCards Home">GC</div>

          <div class="search-wrap" role="search" aria-label="Search posts">
            <input id="search" type="search" placeholder="Search posts" aria-label="Search posts" />
          </div>

          <button id="profileBtn" class="icon-btn" aria-label="Open profile">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="18" height="18">
              <circle cx="12" cy="8" r="3"></circle>
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
            </svg>
          </button>
        </div>

        <div class="top-controls" aria-hidden="false">
          <div class="control" title="Contrast">
            <label for="contrastToggle" class="toggle-label">Contrast</label>
            <input id="contrastToggle" type="checkbox" aria-checked="false" />
          </div>

          <div class="control text-size" title="Text size">
            <button id="decText" class="small-btn" aria-label="Decrease text size">A‑</button>
            <button id="incText" class="small-btn" aria-label="Increase text size">A+</button>
          </div>

<br><br>

          <button id="openNewPost" class="small-btn new-post-btn" aria-label="Create new post">＋ New Post</button>
        </div>
      </header>

      <main id="main" class="container" role="main" aria-live="polite">
        <section id="grid" class="grid" aria-label="Post grid"></section>
      </main>

      <section id="postDetail" class="post-detail" aria-hidden="true" role="region" aria-label="Post detail view">
        <div class="detail-header">
          <button id="detailClose" class="small-btn" aria-label="Back to grid">Back</button>
          <div class="detail-actions">
            <button id="detailAudio" class="small-btn" aria-label="Play audio">🔊</button>

            <div class="lang-picker">
              <select id="detailLangSelect" aria-label="Select target language"></select>
              <button id="detailTranslate" class="small-btn" aria-label="Translate post">Translate</button>
            </div>

            <button id="detailShare" class="small-btn" aria-label="Share post">🔗</button>
            <button id="detailDelete" class="small-btn" aria-label="Delete post" hidden>🗑️</button>
          </div>
        </div>

        <div class="detail-body">
          <div id="detailMedia" class="detail-media" role="img" aria-label="Post media"></div>
          <h2 id="detailTitle" class="detail-title"></h2>
          <p id="detailDescription" class="detail-description"></p>

          <div class="detail-comments">
            <div class="comment-translate-controls">
              <span class="muted">Showing:</span>
              <span id="detailShownLang">original</span>
              <button id="detailShowOriginal" class="small-btn" aria-label="Show original">Original</button>
            </div>

            <h3>Comments</h3>
            <div id="detailCommentsList" class="comments-list" aria-live="polite"></div>

            <label for="detailCommentInput" class="sr-only">Write a comment</label>
            <textarea id="detailCommentInput" rows="3" placeholder="Write a comment..." aria-label="Write a comment"></textarea>
            <div class="modal-actions">
              <button id="detailPostComment" class="primary">Post</button>
            </div>
          </div>
        </div>
      </section>

      <button id="fabNewPost" class="fab" aria-label="Create new post (quick)">＋</button>
    </div>
  </div>

  <template id="card-template">
    <article class="card" role="article" tabindex="0" data-id="">
      <div class="media" role="img" aria-label="Post media"><img alt="Post placeholder" /></div>
      <div class="card-body">
        <h3 class="title"></h3>
        <p class="description"></p>
      </div>
      <div class="card-actions" role="group" aria-label="Post actions">
        <button class="action audio" aria-label="Play audio"></button>
        <button class="action comment" aria-label="Add comment"></button>
        <button class="action share" aria-label="Share post"></button>
        <button class="action delete" aria-label="Delete post" title="Delete post" hidden></button>
      </div>
    </article>
  </template>

  <div id="commentModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="commentTitle">
    <div class="modal-content">
      <h2 id="commentTitle">Comments</h2>
      <div id="commentsList" class="comments-list" aria-live="polite"></div>
      <textarea id="commentInput" rows="3" placeholder="Write a comment..." aria-label="Write a comment"></textarea>
      <div class="modal-actions">
        <button id="postComment" class="primary">Post</button>
        <button id="closeModal">Close</button>
      </div>
    </div>
  </div>

  <div id="newPostModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="newPostTitle">
    <div class="modal-content">
      <h2 id="newPostTitle">Create Post</h2>
      <label for="newTitle">Title</label>
      <input id="newTitle" type="text" maxlength="100" placeholder="Post title" />
      <label for="newDesc">Description</label>
      <textarea id="newDesc" rows="4" placeholder="Short description or announcement"></textarea>
      <label for="newImgUrl">Image URL (optional)</label>
      <div class="img-input-row">
        <input id="newImgUrl" type="url" placeholder="https://example.com/image.jpg" />
        <label class="upload-label" for="newImgFile">or upload</label>
        <input id="newImgFile" type="file" accept="image/*" aria-label="Upload image" />
      </div>
      <!-- image preview removed per user request -->
      <div class="modal-actions">
        <button id="createPost" class="primary">Post</button>
        <button id="cancelCreate">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="script.js" defer></script>
</body>
</html>
